name: iOS CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: "Run UI smoke tests"
        required: false
        default: "false"

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_PROJECT: workouttracker.xcodeproj
  SCHEME_UNIT: workouttracker
  SCHEME_UI: workouttrackerUITestHost
  CONFIGURATION: Debug
  UI_TEST_BUNDLE: workouttrackerUITests
  SIM_DEVICE: iPhone SE (3rd generation)
  SIM_RUNTIME: iOS 26.2

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Confirm selected Xcode
        run: xcodebuild -version

      - name: Preflight (ensure project exists)
        shell: bash
        run: |
          set -euo pipefail
          ls -la
          test -d "${XCODE_PROJECT}"
          xcodebuild -version

      - name: List schemes
        shell: bash
        run: |
          set -euo pipefail
          echo "== Schemes =="
          xcodebuild -project "${XCODE_PROJECT}" -list

      - name: Restore Xcode caches (DerivedData + SourcePackages)
        uses: irgaly/xcode-cache@v1
        with:
          key: xcode-cache-${{ github.workflow }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            xcode-cache-${{ github.workflow }}-${{ github.ref_name }}-

      - name: Resolve Swift Package dependencies
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "${XCODE_PROJECT}" \
            -scheme "${SCHEME_UNIT}" \
            -resolvePackageDependencies

      - name: Dump watch target build settings
        run: |
          set -euo pipefail
          xcodebuild -project "${XCODE_PROJECT}" \
            -target "watchkitapp Watch App" \
            -showBuildSettings \
            | grep -E "PRODUCT_NAME|PRODUCT_BUNDLE_IDENTIFIER|SDKROOT|SUPPORTED_PLATFORMS|TARGETED_DEVICE_FAMILY|RESOURCES_TARGETED_DEVICE_FAMILY|WKApplication" || true

      - name: Create exact iOS 26.2 simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail

          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -F "${SIM_DEVICE}"

          RUNTIME_ID="$(xcrun simctl list runtimes -j | python3 -c 'import sys, json; data=json.load(sys.stdin); target="iOS 26.2"; print(next(rt["identifier"] for rt in data["runtimes"] if rt.get("name")==target and rt.get("isAvailable", False)))')"

          EXISTING_ID="$(xcrun simctl list devices -j | python3 -c 'import sys, json; data=json.load(sys.stdin); name="CI-iPhone-SE3-26-2"; ids=[d["udid"] for devices in data["devices"].values() for d in devices if d.get("name")==name]; print(ids[0] if ids else "")')"

          if [ -n "${EXISTING_ID}" ]; then
            xcrun simctl delete "${EXISTING_ID}" || true
          fi

          SIM_ID="$(xcrun simctl create "CI-iPhone-SE3-26-2" "${SIM_DEVICE}" "${RUNTIME_ID}")"

          echo "Created simulator: ${SIM_ID}"
          echo "destination=platform=iOS Simulator,id=${SIM_ID}" >> "${GITHUB_OUTPUT}"

      - name: Show valid destinations for unit-test scheme
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "${XCODE_PROJECT}" \
            -scheme "${SCHEME_UNIT}" \
            -showdestinations

      - name: Run unit tests (skip UI tests)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults

          xcodebuild -project "${XCODE_PROJECT}" \
            -scheme "${SCHEME_UNIT}" \
            -configuration "${CONFIGURATION}" \
            -destination "${{ steps.sim.outputs.destination }}" \
            -parallel-testing-enabled NO \
            -enableCodeCoverage YES \
            -resultBundlePath "TestResults/unit.xcresult" \
            -skip-testing:"${UI_TEST_BUNDLE}" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Run UI smoke tests (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_ui_tests == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults

          xcodebuild -project "${XCODE_PROJECT}" \
            -scheme "${SCHEME_UI}" \
            -configuration "${CONFIGURATION}" \
            -sdk iphonesimulator \
            -destination "${{ steps.sim.outputs.destination }}" \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -resultBundlePath "TestResults/ui.xcresult" \
            -only-testing:"${UI_TEST_BUNDLE}" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload xcresult bundles (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults
          path: TestResults/*.xcresult

