name: iOS CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: "Run UI smoke tests"
        required: false
        default: "false"

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_PROJECT: workouttracker.xcodeproj
  SCHEME_UNIT: workouttracker
  SCHEME_UI: workouttrackerUITestHost
  CONFIGURATION: Debug
  UI_TEST_BUNDLE: workouttrackerUITests

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Confirm selected Xcode
        run: xcodebuild -version

      - name: Preflight (ensure project exists)
        shell: bash
        run: |
          set -euo pipefail
          ls -la
          test -d "${XCODE_PROJECT}"
          xcodebuild -version

      - name: List schemes
        shell: bash
        run: |
          set -euo pipefail
          echo "== Schemes =="
          xcodebuild -project "${XCODE_PROJECT}" -list

      - name: Pick an iPhone simulator destination
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, re, os

          out = subprocess.check_output(["xcrun","simctl","list","devices","available","-j"], text=True)
          data = json.loads(out)

          def ios_ver(runtime_name: str) -> float:
              m = re.search(r"iOS[- ](\d+(?:\.\d+)?)", runtime_name)
              return float(m.group(1)) if m else 0.0

          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if not d.get("isAvailable", False):
                      continue
                  name = d.get("name", "")
                  if name.startswith("iPhone"):
                      candidates.append((ios_ver(runtime), name, d.get("udid")))

          candidates.sort(reverse=True)
          if not candidates:
              raise SystemExit("No available iPhone simulators found")

          _, name, udid = candidates[0]
          dest = f"platform=iOS Simulator,id={udid}"
          print(f"Using simulator: {name} ({udid})")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"destination={dest}\n")
          PY

      - name: Restore Xcode caches (DerivedData + SourcePackages)
        uses: irgaly/xcode-cache@v1
        with:
          key: xcode-cache-${{ github.workflow }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            xcode-cache-${{ github.workflow }}-${{ github.ref_name }}-

      - name: Resolve Swift Package dependencies
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "${XCODE_PROJECT}" \
            -scheme "${SCHEME_UNIT}" \
            -resolvePackageDependencies

      - name: Dump watch target build settings
        run: |
          set -euo pipefail
          xcodebuild -project "${XCODE_PROJECT}" \
            -target "watchkitapp Watch App" \
            -showBuildSettings \
            | grep -E "PRODUCT_NAME|PRODUCT_BUNDLE_IDENTIFIER|SDKROOT|SUPPORTED_PLATFORMS|TARGETED_DEVICE_FAMILY|RESOURCES_TARGETED_DEVICE_FAMILY|WKApplication" || true

      - name: Show valid destinations for unit-test scheme
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "${XCODE_PROJECT}" \
            -scheme "${SCHEME_UNIT}" \
            -showdestinations

      - name: Run unit tests (skip UI tests)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults

          xcodebuild -project "${XCODE_PROJECT}" \
            -scheme "${SCHEME_UNIT}" \
            -configuration "${CONFIGURATION}" \
            -destination "${{ steps.sim.outputs.destination }}" \
            -parallel-testing-enabled NO \
            -enableCodeCoverage YES \
            -resultBundlePath "TestResults/unit.xcresult" \
            -skip-testing:"${UI_TEST_BUNDLE}" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Run UI smoke tests (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_ui_tests == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults

          xcodebuild -project "${XCODE_PROJECT}" \
            -scheme "${SCHEME_UI}" \
            -configuration "${CONFIGURATION}" \
            -sdk iphonesimulator \
            -destination "${{ steps.sim.outputs.destination }}" \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -resultBundlePath "TestResults/ui.xcresult" \
            -only-testing:"${UI_TEST_BUNDLE}" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload xcresult bundles (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults
          path: TestResults/*.xcresult
